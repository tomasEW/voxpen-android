name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed debug keystore
        env:
          VOXPEN_DEBUG_KEYSTORE_BASE64: ${{ secrets.VOXPEN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$VOXPEN_DEBUG_KEYSTORE_BASE64" ]; then
            echo "VOXPEN_DEBUG_KEYSTORE_BASE64 repository secret is not configured." >&2
            exit 1
          fi
          mkdir -p .ci
          printf '%s' "$VOXPEN_DEBUG_KEYSTORE_BASE64" \
            | base64 --decode > .ci/voxpen-debug.keystore
          chmod 600 .ci/voxpen-debug.keystore
          keytool -list \
            -keystore .ci/voxpen-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            >/dev/null
          echo "Fixed debug keystore restored and verified."

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/voxpen-v1.2.8-build-${GITHUB_RUN_NUMBER}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxpen-v1.2.8-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/voxpen-v1.2.8-build-${{ github.run_number }}.apk
